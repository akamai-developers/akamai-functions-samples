spin_manifest_version = 2

[application]
authors = ["Fermyon"]
description = "Send multiple requests to upstream hosts, and aggregate the results"
name = "aggregate-json"
version = "0.1.0"

[[trigger.http]]
route = "/api/..."
component = "aggregate-json"

[component.aggregate-json]
source = "dist/aggregate-json.wasm"
exclude_files = ["**/node_modules"]
allowed_outbound_hosts = ["https://random-data-api.fermyon.app"]

[component.aggregate-json.build]
command = ["npm install", "npm run build"]
watch = ["src/**/*.ts"]

[[trigger.http]]
route = "/..."
component = "frontend"

[component.frontend]
source = { url = "https://github.com/spinframework/spin-fileserver/releases/download/v0.3.0/spin_static_fs.wasm", digest = "sha256:ef88708817e107bf49985c7cefe4dd1f199bf26f6727819183d5c996baa3d148" }
files = [{ source = "frontend", destination = "/" }]
