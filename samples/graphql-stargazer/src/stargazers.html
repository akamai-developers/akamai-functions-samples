<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stargazers for __ORG__/__REPO__ &middot; Akamai Functions</title>
  <style>
    :root {
      --bg: #0b1020;
      --card: #141a2e;
      --border: #26304d;
      --text: #e7ebf5;
      --muted: #9aa5c0;
      --accent: #f5b301;
      --accent-hover: #d99e00;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 200px 1.5rem 1.5rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 1.0625rem;
      background: radial-gradient(1200px 600px at 50% -10%, #3a2e0a 0%, var(--bg) 60%), var(--bg);
      color: var(--text);
    }

    .card {
      width: 100%;
      max-width: 720px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #ffd766;
      background: rgba(245, 179, 1, 0.14);
      border: 1px solid rgba(245, 179, 1, 0.4);
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
    }

    .stars {
      margin: 1.25rem 0 0.25rem;
      font-size: 3rem;
      line-height: 1;
      font-weight: 800;
      color: var(--accent);
    }

    h1 {
      margin: 0.5rem 0 0.5rem;
      font-size: 1.5rem;
      line-height: 1.2;
    }

    p {
      color: var(--muted);
      line-height: 1.6;
      margin: 0.75rem 0;
    }

    p code {
      color: var(--text);
      background: rgba(255, 255, 255, 0.06);
      padding: 0.1rem 0.4rem;
      border-radius: 6px;
      font-size: 0.9em;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 1rem;
      padding: 0.85rem 1.5rem;
      background: var(--accent);
      color: #2b2205;
      text-decoration: none;
      font-weight: 700;
      font-size: 1rem;
      border-radius: 10px;
      transition: background 0.15s ease, transform 0.05s ease;
    }

    .btn:hover { background: var(--accent-hover); }
    .btn:active { transform: translateY(1px); }
    .btn svg { width: 1.1em; height: 1.1em; }

    .btn.secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn.secondary:hover { background: rgba(255, 255, 255, 0.06); }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
      margin-top: 0.5rem;
    }

    .actions .btn { margin-top: 0; }

    footer {
      margin-top: 1.75rem;
      color: var(--muted);
      font-size: 0.85rem;
    }

    footer a {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.15s ease;
    }

    footer a:hover { color: var(--text); }
    footer a svg { width: 1em; height: 1em; }
  </style>
</head>
